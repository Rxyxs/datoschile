name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]" flake8
      - name: Lint (errores de sintaxis y nombres no definidos)
        run: flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Tests sin conexión
        run: pytest -v
      - name: El paquete se construye
        run: pip install build && python -m build
