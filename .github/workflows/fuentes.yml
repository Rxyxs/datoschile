# Descarga datos reales cada semana y comprueba valores conocidos: si una fuente cambia
# su formato, este workflow falla antes de que le pase a quien usa la librería.
name: fuentes

on:
  schedule:
    - cron: "0 12 * * 1"  # lunes 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pruebas contra las fuentes reales
        run: pytest -v -m red -o addopts=""
